# Generated by scripts/write-gitops.ps1 from system.json: change system.json and run the script.
# The ingress of the cluster: one Envoy proxy behind the public IP the seed created (so the host names are known before
# the cluster exists), HTTP redirected to HTTPS, and one HTTPS listener per host name: each environment's app, each
# further deployable of it, and the Argo CD web UI.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-gateway
    namespace: platform-ingress
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-gateway
  namespace: platform-ingress
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-cmdemo3-cluster
          service.beta.kubernetes.io/azure-pip-name: pip-cmdemo3-ingress
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: platform-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: argocd-cmdemo3.20-225-155-175.sslip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-argocd
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - name: https-tdd
      protocol: HTTPS
      port: 443
      hostname: cmdemo3-tdd.20-225-155-175.sslip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-tdd
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: cmdemo3-tdd
    - name: https-uat
      protocol: HTTPS
      port: 443
      hostname: cmdemo3-uat.20-225-155-175.sslip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-uat
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: cmdemo3-uat
    - name: https-prod
      protocol: HTTPS
      port: 443
      hostname: cmdemo3-prod.20-225-155-175.sslip.io
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-prod
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: cmdemo3-prod
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: platform-ingress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: platform-ingress
      sectionName: https-argocd
  hostnames:
    - argocd-cmdemo3.20-225-155-175.sslip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
