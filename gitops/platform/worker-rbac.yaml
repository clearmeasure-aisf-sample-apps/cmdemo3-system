# What the Octopus Kubernetes worker's script pods may do outside their own namespace: create an environment's
# namespace and its database credentials (step "Prepare environment"), read those credentials (the database and test
# steps), read the workloads they verify, and start the backup and restore-test jobs. Octopus holds no credential of the cluster; the worker polls Octopus.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: octopus-worker-environments
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list"]
  # Step "Record restore point" and runbook "Restore test" start a job from the environment's CronJobs and wait for it.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: octopus-worker-environments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: octopus-worker-environments
subjects:
  - kind: ServiceAccount
    name: octopus-worker-scripts
    namespace: octopus-worker
