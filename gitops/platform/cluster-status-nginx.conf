# The web server next to the cluster's status collector: it serves the one file the collector writes, to any origin
# (the health dashboard reads it from the visitor's browser), never cached. Nothing else is served.
server {
    listen 8080;
    server_name _;
    root /out;

    location = /cluster.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }
    location / {
        return 404;
    }
}
