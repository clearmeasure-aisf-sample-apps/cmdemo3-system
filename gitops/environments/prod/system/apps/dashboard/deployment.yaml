# Generated by scripts/write-gitops.ps1 from system.json: change system.json and run the script.
# Deployable dashboard, a static site. The image has no tag here: gitops/environments/<env>/dashboard/kustomization.yaml pins
# it. The web server of the image serves the site, and /topology.json and /runtime/ from ConfigMap dashboard-content
# (mounted at /content; the kubelet refreshes the files when the ConfigMap changes, without a restart).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: acrcmdemo3q3zmsi.azurecr.io/cmdemo3/dashboard
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: content
              mountPath: /content
              readOnly: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: content
          configMap:
            name: dashboard-content
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
