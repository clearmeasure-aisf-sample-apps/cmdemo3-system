# Generated by scripts/write-gitops.ps1 from system.json: change system.json and run the script.
# Deployable ui. The image has no tag here: gitops/environments/<env>/ui/kustomization.yaml pins it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: acrcmdemo3q3zmsi.azurecr.io/cmdemo3/ui
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__SqlConnectionString
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: app-connection-string
            # No OpenTelemetry collector in the cluster: the app's OTLP exporter stays off.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            # Telemetry goes to the environment's Application Insights under the app's own name, when the
            # environment has capability "telemetry": the cluster job then keeps the connection string in Secret
            # "telemetry" (it never reaches Git), and the variable names that Secret. Without the capability the
            # variable names a Secret that does not exist, the app gets no connection string and exports nothing.
            - name: OTEL_SERVICE_NAME
              value: "cmdemo3-ui"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: "telemetry-off"
                  key: connection-string
                  optional: true
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app.kubernetes.io/name: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
