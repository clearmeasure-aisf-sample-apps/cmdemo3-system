    @startuml
    !pragma layout smetana
    !include <C4/C4_Deployment>
    LAYOUT_LEFT_RIGHT()
    HIDE_STEREOTYPE()
    SHOW_PERSON_OUTLINE()
    skinparam wrapWidth 300
    skinparam maxMessageSize 220
    skinparam svgLinkTarget _blank
    skinparam hyperlinkColor #1f5fae
    skinparam hyperlinkUnderline true
    skinparam nodesep 30
    skinparam ranksep 40
    UpdateElementStyle("container", $bgColor="#607d8b", $fontColor="#ffffff", $borderColor="#455a64")
    UpdateElementStyle("person", $bgColor="#37474f", $fontColor="#ffffff", $borderColor="#263238")
    AddBoundaryTag("scope", $bgColor="#ffffff", $fontColor="#263238", $borderColor="#78909c", $borderStyle=DottedLine())
    AddNodeTag("region", $bgColor="#fafafa", $fontColor="#37474f", $borderColor="#90a4ae", $borderStyle=DashedLine())
    AddNodeTag("plan", $bgColor="#ffffff", $fontColor="#37474f", $borderColor="#b0bec5")
    UpdateRelStyle($textColor="#455a64", $lineColor="#78909c")

    Person(browser, "Browser", "a user, or this dashboard")
    Boundary(sub, "Azure subscription", $type="subscription", $tags="scope") {
      Boundary(rg_cluster, "rg-cmdemo3-cluster", $type="resource group", $tags="scope") {
        Deployment_Node(cluster, "aks-cmdemo3", "AKS cluster, southcentralus: 1 x Standard_D4as_v6", "one public address, 20.225.155.175 (Envoy Gateway), for every environment", $tags="plan") {
          Deployment_Node(region_primary, "cmdemo3-tdd", "namespace: environment tdd", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAL4AAAAWCAYAAAB+OyYeAAAAJklEQVR42u3BAQEAAACCIP+vbkhAAQAAAAAAAAAAAAAAAAAAADwYQWYAAUAsKwYAAAAASUVORK5CYII=>", $tags="region") {
            Container(app_ui_primary, "ui", "Deployment: ui", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAACSCAYAAABsS9cKAAAApElEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOBhOwAAARPT3VIAAAAASUVORK5CYII=>")
            ContainerDb(sqldb, "db", "SQL Server 2022 Express, StatefulSet", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAuCAYAAAABQwQEAAAAQ0lEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4GWz3gABsYbbhAAAAABJRU5ErkJggg==>")
            Container(swa_dashboard, "dashboard", "static site: dashboard", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAuCAYAAAABQwQEAAAAQ0lEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4GWz3gABsYbbhAAAAABJRU5ErkJggg==>")
          }
        }
        Container(swa_status, "swa-cmdemo3-tdd-status", "Azure Static Web App: status", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAuCAYAAAABQwQEAAAAQ0lEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4GWz3gABsYbbhAAAAABJRU5ErkJggg==>")
      }
    }
    Rel(browser, app_ui_primary, "cmdemo3-tdd.20-225-155-17…sslip.io", "HTTPS", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAAAiCAYAAADYt9L+AAAALElEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAF4GVSIAAXQNQtEAAAAASUVORK5CYII=>\n<U+00A0>", $link="https://cmdemo3-tdd.20-225-155-175.sslip.io")
    Rel(app_ui_primary, sqldb, "reads and writes", "TCP 1433", "<img:data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAAAiCAYAAADYt9L+AAAALElEQVR42u3BMQEAAADCoPVPbQwfoAAAAAAAAAAAAAAAAAAAAAAAAAAAAF4GVSIAAXQNQtEAAAAASUVORK5CYII=>\n<U+00A0>")
    Rel(browser, swa_dashboard, "loads the dashboard", "HTTPS", "", $link="https://cmdemo3-tdd-dashboard.20-225-155-175.sslip.io")
    Rel(browser, swa_status, "loads the dashboard", "HTTPS", "", $link="https://red-cliff-0de3bc510.5.azurestaticapps.net")
