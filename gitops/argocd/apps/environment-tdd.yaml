# Generated by scripts/write-gitops.ps1 from system.json: change system.json and run the script.
# Environment tdd: its definition (<slug>-system-<env>, written by the Octopus project cmdemo3-system) and one
# Application per deployable (the image tag, written by the deployable's Octopus project). The argo.octopus.com
# annotations hold the slugs of the Octopus project and environment each Application belongs to.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmdemo3-system-tdd
  namespace: argocd
  annotations:
    argo.octopus.com/project: cmdemo3-system
    argo.octopus.com/environment: tdd
    # Only a commit under this path starts a comparison: a pin of another environment does not.
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/clearmeasure-aisf-sample-apps/cmdemo3-system.git
    targetRevision: main
    path: gitops/environments/tdd/system
  destination:
    server: https://kubernetes.default.svc
    namespace: cmdemo3-tdd
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cmdemo3-ui-tdd
  namespace: argocd
  annotations:
    argo.octopus.com/project: cmdemo3-ui
    argo.octopus.com/environment: tdd
    argo.octopus.com/default-container-registry: acrcmdemo3q3zmsi.azurecr.io
    argocd.argoproj.io/manifest-generate-paths: .;../system/apps/ui
spec:
  project: default
  source:
    repoURL: https://github.com/clearmeasure-aisf-sample-apps/cmdemo3-system.git
    targetRevision: main
    path: gitops/environments/tdd/ui
  destination:
    server: https://kubernetes.default.svc
    namespace: cmdemo3-tdd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
