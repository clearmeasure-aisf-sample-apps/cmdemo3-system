# Generated by scripts/write-gitops.ps1 from system.json: change system.json and run the script.
# The root Application: Argo CD applies every Application under gitops/argocd/apps.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/clearmeasure-aisf-sample-apps/cmdemo3-system.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
