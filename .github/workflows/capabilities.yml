# Nightly capability checks: scripts/test-capabilities.ps1 proves, read-only, every capability this system claims
# (one check per CAP-NNN of the demo-environment kit's docs/capabilities.md): rulesets, pins, Octopus processes,
# deployment stacks, image locks, roles, runbook results, clean deployment logs. It signs in as the system's own
# identities: Azure as id-<slug>-plan (Reader), Octopus as the system's service account. The GitHub reads (this
# repository's files, rulesets and branches, and the app repository's rulesets) are made as the system's own GitHub
# App when system.json names one (github.app; the App's key is the secret SYSTEM_APP_PRIVATE_KEY): a token for this
# repository with Contents read only, which reads a public app repository as anyone does. Otherwise they go through
# the stored token OCTOPUS_GITHUB_TOKEN. Job own then runs the system's own checks (scripts/test-own.ps1: each
# infra/own/test-*.ps1 in every environment) in environment azure-read, as id-<slug>-plan and nothing else. Job report
# keeps the result of both as one issue with label "capability": opened or updated while a check fails, closed when
# the next run passes. Every system build ends with the same checks (system.yml calls this workflow).
name: capabilities

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  capabilities:
    runs-on: ubuntu-24.04
    environment: capabilities
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.checks.outcome }}
      failed: ${{ steps.result.outputs.failed }}
      checked: ${{ steps.result.outputs.checked }}
    steps:
      - uses: actions/checkout@v6.0.1

      # The checks compare Git, Octopus and Azure at rest, so they first wait until no Octopus task runs. They sign in to
      # Azure only after that: a GitHub OIDC sign-in cannot fetch new tokens (such as the registry's) an hour later.
      - name: Sign in to Octopus to wait
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      - name: Wait until Octopus is quiet
        shell: pwsh
        run: ./scripts/test-capabilities.ps1 -WaitOnly -WaitMinutes 50

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ vars.OCTOPUS_URL }}
          service_account_id: ${{ vars.OCTOPUS_SERVICE_ACCOUNT_ID }}

      # A system.json that names a GitHub App in part, or names one whose key is not stored, stops the run: nothing
      # falls back to the stored token.
      - name: Which GitHub identity
        id: identity
        env:
          STORES_APP_KEY: ${{ secrets.SYSTEM_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          app=$(jq -c '.github.app // null' system.json)
          if [ "$(jq -r 'type' <<<"$app")" = "null" ]; then
            echo "GitHub identity: the stored token OCTOPUS_GITHUB_TOKEN (system.json names no GitHub App)"
            echo "client-id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An App that is named in part is a system that does not work: Octopus would use the App (it reads the ids,
          # not the client id) while this run used the stored token. The run stops, and nothing falls back.
          back="Nothing falls back to the stored token: complete github.app, or take it out of system.json."
          if [ "$(jq -r 'type' <<<"$app")" != "object" ]; then
            echo "FAIL system.json github.app is not an object (id, slug, clientId, installationId). $back"
            exit 1
          fi
          missing=$(jq -r '. as $named | [("id", "slug", "clientId", "installationId") | select(($named[.] // "" | tostring) == "")] | join(", ")' <<<"$app")
          if [ -n "$missing" ]; then
            echo "FAIL system.json names a GitHub App (github.app) without $missing: the App is configured in part. $back"
            exit 1
          fi
          if [ "$STORES_APP_KEY" != "true" ]; then
            slug=$(jq -r '.slug' <<<"$app")
            echo "FAIL system.json names the GitHub App $slug, and its key is not stored here (secret SYSTEM_APP_PRIVATE_KEY). Nothing falls back."
            exit 1
          fi
          echo "GitHub identity: the system's App $(jq -r '.slug' <<<"$app") (id $(jq -r '.id' <<<"$app")), named by system.json github.app"
          echo "client-id=$(jq -r '.clientId' <<<"$app")" >> "$GITHUB_OUTPUT"

      - name: Token of the system's App
        id: app
        if: steps.identity.outputs.client-id != ''
        # By commit, not by tag: the action is handed a private key. The commit is the one tag v3.2.0 names.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.identity.outputs.client-id }}
          private-key: ${{ secrets.SYSTEM_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Prove every capability
        id: checks
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.OCTOPUS_GITHUB_TOKEN }}
        run: |
          ./scripts/test-capabilities.ps1 -WaitMinutes 40 *>&1 | Tee-Object -FilePath "${{ runner.temp }}/capabilities.txt"
          exit $LASTEXITCODE

      # The whole report is this job's summary; job report takes what failed into the issue.
      - name: Hand the result on
        id: result
        env:
          OUTCOME: ${{ steps.checks.outcome }}
          REPORT: ${{ runner.temp }}/capabilities.txt
        run: |
          set -euo pipefail
          touch "$REPORT"
          { echo '```'; cat "$REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          lines=""
          if [ "$OUTCOME" != "success" ]; then lines=$(grep -E '^(FAIL|[0-9]+ of)' "$REPORT" || tail -n 20 "$REPORT"); fi
          # Base64 keeps the lines one line of output.
          echo "failed=$(printf '%s' "$lines" | base64 -w0)" >> "$GITHUB_OUTPUT"
          # A run that waited for Octopus in vain checked nothing (scripts/test-capabilities.ps1 says NOT CHECKED).
          if grep -q '^NOT CHECKED' "$REPORT"; then echo "checked=false" >> "$GITHUB_OUTPUT"; else echo "checked=true" >> "$GITHUB_OUTPUT"; fi

  # After the capability checks, which wait until Octopus is quiet: a job in azure-read cannot sign in to Octopus.
  own:
    needs: capabilities
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: azure-read
    # What a GitHub OIDC sign-in to Azure lasts.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.own.outcome }}
      failed: ${{ steps.result.outputs.failed }}
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false

      - uses: azure/login@v3
        if: hashFiles('infra/own/test-*.ps1') != ''
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run the system's own checks
        id: own
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/test-own.ps1 *>&1 | Tee-Object -FilePath "${{ runner.temp }}/own.txt"
          exit $LASTEXITCODE

      - name: Hand the result of the own checks on
        id: result
        env:
          OUTCOME: ${{ steps.own.outcome }}
          REPORT: ${{ runner.temp }}/own.txt
        run: |
          set -euo pipefail
          touch "$REPORT"
          { echo '```'; cat "$REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          lines=""
          if [ "$OUTCOME" != "success" ]; then lines=$(grep -E '^(FAIL|[0-9]+ of)' "$REPORT" || tail -n 20 "$REPORT"); fi
          echo "failed=$(printf '%s' "$lines" | base64 -w0)" >> "$GITHUB_OUTPUT"

  # One issue for both jobs: the fleet reads it as its finding capability/<slug>.
  report:
    needs: [capabilities, own]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report failed capabilities as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CAPABILITIES_RESULT: ${{ needs.capabilities.result }}
          CAPABILITIES_OUTCOME: ${{ needs.capabilities.outputs.outcome }}
          CAPABILITIES_FAILED: ${{ needs.capabilities.outputs.failed }}
          CAPABILITIES_CHECKED: ${{ needs.capabilities.outputs.checked }}
          OWN_RESULT: ${{ needs.own.result }}
          OWN_OUTCOME: ${{ needs.own.outputs.outcome }}
          OWN_FAILED: ${{ needs.own.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # What a job handed on, or one line for a job whose checks gave no result.
          unproven() {
            if [ "$2" = "success" ] && [ "$3" = "success" ]; then return 0; fi
            local lines
            lines=$(printf '%s' "$4" | base64 -d)
            if [ -n "$lines" ]; then printf '%s\n' "$lines"; else echo "FAIL $1: no result (job $1: $2, its checks: ${3:-not run}); see the run"; fi
          }
          failed=$(unproven capabilities "$CAPABILITIES_RESULT" "$CAPABILITIES_OUTCOME" "$CAPABILITIES_FAILED"; unproven own "$OWN_RESULT" "$OWN_OUTCOME" "$OWN_FAILED")
          gh label create capability --color B60205 --description "A capability of the system is not proven" --force >/dev/null
          issue=$(gh issue list --label capability --state open --json number --jq '.[0].number // empty')
          # Nothing failed and nothing was checked (Octopus stayed busy): the issue stays as it is, open or not.
          if [ -z "$failed" ] && [ "${CAPABILITIES_CHECKED:-true}" = "false" ]; then
            echo "The capabilities were not checked in this run: Octopus did not become quiet. The issue with label capability is left as it is." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if [ -z "$failed" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All capabilities proven on $(date -u +%F) ($RUN_URL)."
            fi
            exit 0
          fi
          intro="The nightly capability checks failed ($RUN_URL). Each FAIL line names the capability (CAP-NNN in the kit's docs/capabilities.md) and what was found;"
          intro="$intro a line FAIL own names one of the system's own checks (infra/own/test-*.ps1) and the environment."
          body=$(printf '%s\n\n```\n%s\n```\n' "$intro" "$failed")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Capabilities not proven" --label capability --body "$body"
          fi
          exit 1
