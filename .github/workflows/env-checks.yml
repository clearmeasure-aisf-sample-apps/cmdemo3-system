# Checks of a pull request to the system repository (runtime aks-argocd): the required check "env-checks" of the
# ruleset on main. No secret in the history, system.json and gitops/ are consistent, the YAML is valid and builds with
# Kustomize, the Octopus configuration is valid Terraform and the Bicep compiles without a warning. Job "preview" shows
# what the change would do to each environment and to the cluster; it informs and never blocks.
name: env-checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      # No secret in the repository (capability CAP-055); the command-line tool, not gitleaks-action, which needs a
      # license for organization repositories. It scans the history of the checked-out commit (--log-opts=HEAD), not
      # every branch, so a finding on one branch fails that branch only.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1 --log-opts="HEAD"
          rm gitleaks

      - name: system.json and gitops/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/write-gitops.ps1
          # A file the script would change means system.json was changed without running it.
          git diff --exit-code
          if (git status --porcelain) { throw 'scripts/write-gitops.ps1 writes files that are not committed: run it and commit the result.' }
          ./scripts/test-system.ps1

      - name: yamllint
        run: |
          set -euo pipefail
          pipx install yamllint
          yamllint --strict .

      - name: Kustomize builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          kubectl kustomize gitops/platform | Out-Null
          foreach ($pin in Get-ChildItem -Path gitops/environments -Recurse -Filter kustomization.yaml | Where-Object { $_.Directory.Parent.Parent.Name -eq 'environments' }) {
              kubectl kustomize $pin.DirectoryName | Out-Null
              Write-Host "PASS $([IO.Path]::GetRelativePath($PWD, $pin.DirectoryName))"
          }

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      # Warnings fail like errors (no broken windows): Bicep writes its diagnostics to stderr with exit code 0. The
      # setting keeps az from reporting its own config change when it installs Bicep.
      - name: Terraform and Bicep
        env:
          AZURE_BICEP_USE_BINARY_FROM_PATH: "false"
        run: |
          set -euo pipefail
          terraform -chdir=octopus fmt -check -diff
          terraform -chdir=octopus init -backend=false -input=false
          terraform -chdir=octopus validate
          az bicep install
          for file in infra/cluster.bicep bootstrap/seed.bicep; do
            diagnostics=$(az bicep build --file "$file" --stdout 2>&1 >/dev/null | grep -E ': (Warning|Error) ' || true)
            if [ -n "$diagnostics" ]; then echo "$diagnostics"; exit 1; fi
          done

  # What the change would do to each environment and to the cluster (capability CAP-002), in the job summary:
  # scripts/preview-environment.ps1. It signs in to Azure as id-<slug>-plan (Reader and the what-if role), so it runs
  # only for branches of this repository: a pull request from a fork gets no credential (CAP-012).
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: azure-read
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview per environment
        shell: pwsh
        env:
          PREVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/preview-environment.ps1
